<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Same-origin policy: the browser sends the cookie with cross-site requests but blocks the page from reading the response" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .h    { font: 600 13px "IBM Plex Sans", sans-serif; fill: #EDF3F3; }
    .lbl  { font: 500 12px "IBM Plex Sans", sans-serif; fill: #DDE6E7; }
    .mono { font: 400 11px "IBM Plex Mono", monospace; fill: #A6B5B8; }
    .note { font: 400 10px "IBM Plex Mono", monospace; fill: #6F8085; }
    .ok   { fill: #33604E; }
    .no   { fill: #8E2B24; }
    .box  { fill: #101A1E; stroke: #1D2E34; }
    .jar  { fill: #162328; stroke: #2F8F8A; }
    .send { stroke: #53D6CE; stroke-width: 1.6; marker-end: url(#a); }
    .block{ stroke: #8E2B24; stroke-width: 1.6; stroke-dasharray: 5 4; marker-end: url(#x); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#53D6CE"/></marker>
    <marker id="x" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9,9 M9,1 L1,9" stroke="#8E2B24" stroke-width="1.6"/></marker>
  </defs>

  <!-- attacker page -->
  <rect class="box" x="30" y="70" width="180" height="120" rx="3" stroke="#8E2B24"/>
  <text class="h" x="120" y="94" text-anchor="middle" fill="#C86A62">evil.com</text>
  <text class="note" x="120" y="114" text-anchor="middle">page you're tricked</text>
  <text class="note" x="120" y="128" text-anchor="middle">into visiting</text>
  <text class="mono" x="120" y="160" text-anchor="middle" fill="#A6B5B8">fetch("bank.com</text>
  <text class="mono" x="120" y="174" text-anchor="middle" fill="#A6B5B8">/transfer")</text>

  <!-- browser gatekeeper in the middle -->
  <rect class="box" x="285" y="40" width="150" height="300" rx="3" stroke="#2F8F8A"/>
  <text class="h" x="360" y="64" text-anchor="middle">Browser</text>
  <text class="note" x="360" y="80" text-anchor="middle">the gatekeeper</text>
  <!-- cookie jar -->
  <rect class="jar" x="305" y="110" width="110" height="80" rx="4"/>
  <text class="lbl" x="360" y="135" text-anchor="middle">🍪 cookie jar</text>
  <text class="mono" x="360" y="158" text-anchor="middle" fill="#53D6CE">bank.com</text>
  <text class="mono" x="360" y="172" text-anchor="middle" fill="#53D6CE">session=abc</text>

  <!-- bank server -->
  <rect class="box" x="510" y="70" width="180" height="120" rx="3"/>
  <text class="h" x="600" y="94" text-anchor="middle">bank.com</text>
  <text class="note" x="600" y="114" text-anchor="middle">your logged-in</text>
  <text class="note" x="600" y="128" text-anchor="middle">session lives here</text>

  <!-- request goes out WITH cookie -->
  <path class="send" d="M415 150 C 460 150, 470 215, 510 215" fill="none"/>
  <rect x="440" y="196" width="30" height="16" rx="8" class="ok"/>
  <text class="note" x="455" y="207" text-anchor="middle" fill="#DDE6E7">🍪</text>
  <text class="mono" x="470" y="238" text-anchor="middle">request sent — cookie attached</text>

  <!-- response blocked from being read -->
  <path class="block" d="M510 265 C 470 265, 460 300, 415 300" fill="none"/>
  <text class="mono" x="470" y="322" text-anchor="middle" fill="#C86A62">response blocked from evil.com's reach</text>

  <text class="note" x="360" y="384" text-anchor="middle" fill="#6F8085">SOP doesn't stop the request. It stops evil.com from reading the reply. That gap is why CSRF exists.</text>
</svg>
