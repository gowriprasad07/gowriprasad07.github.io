<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OAuth 2.0 authorization code flow" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .role { font: 600 12px "IBM Plex Sans", sans-serif; fill: #EDF3F3; }
    .step { font: 400 11px "IBM Plex Mono", monospace; fill: #A6B5B8; }
    .num  { font: 500 10px "IBM Plex Mono", monospace; fill: #0A1013; }
    .life { stroke: #1D2E34; stroke-width: 1; }
    .msg  { stroke: #53D6CE; stroke-width: 1.4; marker-end: url(#a); }
    .back { stroke: #2F8F8A; stroke-width: 1.4; stroke-dasharray: 4 3; marker-end: url(#a2); }
    .box  { fill: #101A1E; stroke: #1D2E34; }
    .numc { fill: #53D6CE; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#53D6CE"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F8F8A"/></marker>
  </defs>

  <rect class="box" x="30"  y="20" width="130" height="30" rx="2"/><text class="role" x="95"  y="39" text-anchor="middle">User</text>
  <rect class="box" x="230" y="20" width="130" height="30" rx="2"/><text class="role" x="295" y="39" text-anchor="middle">Client (app)</text>
  <rect class="box" x="470" y="20" width="220" height="30" rx="2"/><text class="role" x="580" y="39" text-anchor="middle">Authorization Server</text>

  <line class="life" x1="95"  y1="50" x2="95"  y2="380"/>
  <line class="life" x1="295" y1="50" x2="295" y2="380"/>
  <line class="life" x1="580" y1="50" x2="580" y2="380"/>

  <line class="msg" x1="95" y1="82" x2="295" y2="82"/>
  <circle class="numc" cx="95" cy="82" r="8"/><text class="num" x="95" y="85" text-anchor="middle">1</text>
  <text class="step" x="195" y="75" text-anchor="middle">"Sign in / connect"</text>

  <line class="msg" x1="295" y1="120" x2="580" y2="120"/>
  <circle class="numc" cx="295" cy="120" r="8"/><text class="num" x="295" y="123" text-anchor="middle">2</text>
  <text class="step" x="437" y="113" text-anchor="middle">redirect: client_id, redirect_uri, scope, state</text>

  <line class="msg" x1="580" y1="158" x2="95" y2="158"/>
  <circle class="numc" cx="580" cy="158" r="8"/><text class="num" x="580" y="161" text-anchor="middle">3</text>
  <text class="step" x="337" y="151" text-anchor="middle">login + consent prompt</text>

  <line class="msg" x1="95" y1="196" x2="580" y2="196"/>
  <circle class="numc" cx="95" cy="196" r="8"/><text class="num" x="95" y="199" text-anchor="middle">4</text>
  <text class="step" x="337" y="189" text-anchor="middle">user approves</text>

  <line class="msg" x1="580" y1="234" x2="295" y2="234"/>
  <circle class="numc" cx="580" cy="234" r="8"/><text class="num" x="580" y="237" text-anchor="middle">5</text>
  <text class="step" x="437" y="227" text-anchor="middle">redirect back: code + state</text>

  <line class="back" x1="295" y1="272" x2="580" y2="272"/>
  <circle class="numc" cx="295" cy="272" r="8"/><text class="num" x="295" y="275" text-anchor="middle">6</text>
  <text class="step" x="437" y="265" text-anchor="middle">code + client_secret  (back channel)</text>

  <line class="back" x1="580" y1="310" x2="295" y2="310"/>
  <circle class="numc" cx="580" cy="310" r="8"/><text class="num" x="580" y="313" text-anchor="middle">7</text>
  <text class="step" x="437" y="303" text-anchor="middle">access token  (+ id_token if OIDC)</text>

  <line class="msg" x1="295" y1="348" x2="95" y2="348"/>
  <circle class="numc" cx="295" cy="348" r="8"/><text class="num" x="295" y="351" text-anchor="middle">8</text>
  <text class="step" x="195" y="341" text-anchor="middle">logged in / connected</text>

  <text class="step" x="360" y="392" text-anchor="middle" fill="#6F8085">Steps 6-7 happen server-to-server. The code is useless without the client secret.</text>
</svg>
