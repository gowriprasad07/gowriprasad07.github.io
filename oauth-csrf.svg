<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Account binding attack when the state parameter is missing" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .role { font: 600 12px "IBM Plex Sans", sans-serif; fill: #EDF3F3; }
    .step { font: 400 11px "IBM Plex Mono", monospace; fill: #A6B5B8; }
    .bad  { font: 400 11px "IBM Plex Mono", monospace; fill: #C86A62; }
    .num  { font: 500 10px "IBM Plex Mono", monospace; fill: #0A1013; }
    .life { stroke: #1D2E34; stroke-width: 1; }
    .msg  { stroke: #53D6CE; stroke-width: 1.4; marker-end: url(#a); }
    .atk  { stroke: #8E2B24; stroke-width: 1.4; marker-end: url(#ar); }
    .box  { fill: #101A1E; stroke: #1D2E34; }
    .abox { fill: #1C110F; stroke: #8E2B24; }
    .numc { fill: #53D6CE; }
    .numa { fill: #8E2B24; }
    .numt { font: 500 10px "IBM Plex Mono", monospace; fill: #F0F6F6; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#53D6CE"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E2B24"/></marker>
  </defs>

  <rect class="abox" x="30"  y="20" width="130" height="30" rx="2"/><text class="role" x="95"  y="39" text-anchor="middle" fill="#C86A62">Attacker</text>
  <rect class="box"  x="230" y="20" width="130" height="30" rx="2"/><text class="role" x="295" y="39" text-anchor="middle">Victim</text>
  <rect class="box"  x="430" y="20" width="120" height="30" rx="2"/><text class="role" x="490" y="39" text-anchor="middle">Client</text>
  <rect class="box"  x="600" y="20" width="100" height="30" rx="2"/><text class="role" x="650" y="39" text-anchor="middle">Provider</text>

  <line class="life" x1="95"  y1="50" x2="95"  y2="400"/>
  <line class="life" x1="295" y1="50" x2="295" y2="400"/>
  <line class="life" x1="490" y1="50" x2="490" y2="400"/>
  <line class="life" x1="650" y1="50" x2="650" y2="400"/>

  <!-- 1 attacker starts a flow with their own provider account -->
  <line class="atk" x1="95" y1="86" x2="650" y2="86"/>
  <circle class="numa" cx="95" cy="86" r="8"/><text class="numt" x="95" y="89" text-anchor="middle">1</text>
  <text class="bad" x="370" y="79" text-anchor="middle">attacker logs in with THEIR provider account</text>

  <!-- 2 provider returns a code to attacker -->
  <line class="atk" x1="650" y1="124" x2="95" y2="124"/>
  <circle class="numa" cx="650" cy="124" r="8"/><text class="numt" x="650" y="127" text-anchor="middle">2</text>
  <text class="bad" x="370" y="117" text-anchor="middle">provider issues code_ATTACKER (attacker stops here — doesn't redeem it)</text>

  <!-- 3 attacker crafts callback URL and sends to victim -->
  <line class="atk" x1="95" y1="162" x2="295" y2="162"/>
  <circle class="numa" cx="95" cy="162" r="8"/><text class="numt" x="95" y="165" text-anchor="middle">3</text>
  <text class="bad" x="180" y="152" text-anchor="start">sends victim a link:</text>
  <text class="bad" x="300" y="182" text-anchor="middle" style="font-size:10px">client.com/callback?code=code_ATTACKER</text>

  <!-- 4 victim (already logged into client) hits the callback -->
  <line class="msg" x1="295" y1="212" x2="490" y2="212"/>
  <circle class="numc" cx="295" cy="212" r="8"/><text class="num" x="295" y="215" text-anchor="middle">4</text>
  <text class="step" x="392" y="205" text-anchor="middle">victim (logged in) opens it</text>

  <!-- 5 client redeems attacker's code, no state to catch it -->
  <line class="msg" x1="490" y1="250" x2="650" y2="250"/>
  <circle class="numc" cx="490" cy="250" r="8"/><text class="num" x="490" y="253" text-anchor="middle">5</text>
  <text class="step" x="570" y="243" text-anchor="middle">redeems code_ATTACKER</text>
  <text class="step" x="480" y="290" text-anchor="middle" fill="#C86A62">no state param — client can't tell whose flow this was</text>

  <!-- 6 result -->
  <rect x="300" y="300" width="380" height="52" rx="3" fill="#101A1E" stroke="#8E2B24"/>
  <text class="bad" x="490" y="322" text-anchor="middle">Victim's client account is now linked to</text>
  <text class="bad" x="490" y="340" text-anchor="middle">the ATTACKER's provider identity.</text>

  <text class="step" x="360" y="392" text-anchor="middle" fill="#6F8085">The attacker can now "Sign in with Google" into the victim's account, using their own Google login.</text>
</svg>
