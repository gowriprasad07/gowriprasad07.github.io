<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Real OS popup versus a fake Browser-in-the-Browser window drawn inside the page" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .cap   { font: 500 13px "IBM Plex Sans", sans-serif; fill: #EDF3F3; }
    .sub   { font: 400 11px "IBM Plex Mono", monospace; fill: #A6B5B8; }
    .url   { font: 400 11px "IBM Plex Mono", monospace; fill: #DDE6E7; }
    .note  { font: 400 11px "IBM Plex Mono", monospace; fill: #6F8085; }
    .good  { fill: #33604E; }
    .bad   { fill: #8E2B24; }
    .winbar{ fill: #162328; }
    .winbody{ fill: #101A1E; stroke: #1D2E34; }
    .chip  { fill: #0A1013; stroke: #1D2E34; }
    .teal  { fill: #53D6CE; }
  </style>

  <!-- ============ LEFT: real popup ============ -->
  <text class="cap" x="30" y="28">Real browser popup</text>
  <text class="sub" x="30" y="46">a separate OS window, chrome drawn by the OS</text>

  <!-- desktop backdrop -->
  <rect x="30" y="60" width="300" height="330" rx="3" fill="#0A1013" stroke="#1D2E34"/>
  <!-- the real OS window floats, casts a shadow, can leave the browser -->
  <rect x="70" y="120" width="230" height="180" rx="4" class="winbody" filter="url(#sh)"/>
  <rect x="70" y="120" width="230" height="26" rx="4" class="winbar"/>
  <circle cx="84" cy="133" r="4" fill="#8E2B24"/>
  <circle cx="98" cy="133" r="4" fill="#8A5A16"/>
  <circle cx="112" cy="133" r="4" fill="#33604E"/>
  <rect x="140" y="126" width="150" height="14" rx="7" class="chip"/>
  <text class="url" x="150" y="136">🔒 accounts.google.com</text>
  <text class="cap" x="130" y="185" fill="#DDE6E7" style="font-size:12px">Sign in with Google</text>
  <rect x="100" y="205" width="170" height="20" rx="2" fill="#0A1013" stroke="#1D2E34"/>
  <rect x="100" y="233" width="170" height="20" rx="2" fill="#0A1013" stroke="#1D2E34"/>
  <rect x="100" y="262" width="80" height="20" rx="2" class="teal"/>
  <text class="note" x="82" y="330">You can drag it off the browser.</text>
  <text class="note" x="82" y="346">That proves it is real.</text>

  <!-- ============ RIGHT: fake in-page window ============ -->
  <text class="cap" x="390" y="28">Browser-in-the-Browser</text>
  <text class="sub" x="390" y="46">an HTML div — chrome drawn by the attacker's page</text>

  <!-- attacker page fills the area -->
  <rect x="390" y="60" width="300" height="330" rx="3" fill="#0A1013" stroke="#8E2B24"/>
  <text class="note" x="402" y="80" fill="#6F8085">attacker.com — page content</text>
  <!-- the "window" is just a div painted to look like one -->
  <rect x="430" y="120" width="230" height="180" rx="4" class="winbody"/>
  <rect x="430" y="120" width="230" height="26" rx="4" class="winbar"/>
  <circle cx="444" cy="133" r="4" fill="#8E2B24"/>
  <circle cx="458" cy="133" r="4" fill="#8A5A16"/>
  <circle cx="472" cy="133" r="4" fill="#33604E"/>
  <rect x="500" y="126" width="150" height="14" rx="7" class="chip"/>
  <text class="url" x="510" y="136">🔒 accounts.google.com</text>
  <text class="cap" x="490" y="185" fill="#DDE6E7" style="font-size:12px">Sign in with Google</text>
  <rect x="460" y="205" width="170" height="20" rx="2" fill="#0A1013" stroke="#1D2E34"/>
  <rect x="460" y="233" width="170" height="20" rx="2" fill="#0A1013" stroke="#1D2E34"/>
  <rect x="460" y="262" width="80" height="20" rx="2" class="bad"/>
  <text class="note" x="442" y="330" fill="#8E2B24">Same pixels. Same URL text.</text>
  <text class="note" x="442" y="346" fill="#8E2B24">But it cannot leave the page.</text>

  <!-- verdict strip -->
  <text class="sub" x="360" y="420" text-anchor="middle" fill="#6F8085">The address bar you are taught to trust is, on the right, just text the attacker typed.</text>

  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
</svg>
