<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NTLM challenge-response handshake" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .lbl  { font: 500 13px "IBM Plex Mono", monospace; fill: #DDE6E7; }
    .role { font: 600 13px "IBM Plex Sans", sans-serif; fill: #EDF3F3; }
    .step { font: 400 12px "IBM Plex Mono", monospace; fill: #A6B5B8; }
    .num  { font: 500 11px "IBM Plex Mono", monospace; fill: #0A1013; }
    .lifeline { stroke: #1D2E34; stroke-width: 1; }
    .msg  { stroke: #53D6CE; stroke-width: 1.5; marker-end: url(#arrow); }
    .box  { fill: #101A1E; stroke: #1D2E34; stroke-width: 1; }
    .numc { fill: #53D6CE; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#53D6CE"/>
    </marker>
  </defs>

  <!-- actors -->
  <rect class="box" x="40"  y="24" width="150" height="34" rx="2"/>
  <text class="role" x="115" y="46" text-anchor="middle">Client</text>

  <rect class="box" x="285" y="24" width="150" height="34" rx="2"/>
  <text class="role" x="360" y="46" text-anchor="middle">Server</text>

  <rect class="box" x="530" y="24" width="150" height="34" rx="2"/>
  <text class="role" x="605" y="46" text-anchor="middle">Domain Controller</text>

  <!-- lifelines -->
  <line class="lifeline" x1="115" y1="58" x2="115" y2="360"/>
  <line class="lifeline" x1="360" y1="58" x2="360" y2="360"/>
  <line class="lifeline" x1="605" y1="58" x2="605" y2="360"/>

  <!-- 1: NEGOTIATE -->
  <line class="msg" x1="115" y1="96" x2="360" y2="96"/>
  <circle class="numc" cx="115" cy="96" r="9"/><text class="num" x="115" y="100" text-anchor="middle">1</text>
  <text class="step" x="237" y="88" text-anchor="middle">NEGOTIATE — hello, here's what I support</text>

  <!-- 2: CHALLENGE -->
  <line class="msg" x1="360" y1="140" x2="115" y2="140"/>
  <circle class="numc" cx="360" cy="140" r="9"/><text class="num" x="360" y="144" text-anchor="middle">2</text>
  <text class="step" x="237" y="132" text-anchor="middle">CHALLENGE — random 8-byte nonce</text>

  <!-- 3: AUTHENTICATE -->
  <line class="msg" x1="115" y1="184" x2="360" y2="184"/>
  <circle class="numc" cx="115" cy="184" r="9"/><text class="num" x="115" y="188" text-anchor="middle">3</text>
  <text class="step" x="237" y="176" text-anchor="middle">AUTHENTICATE — response = f(NT hash, nonce)</text>

  <!-- 4: validate to DC -->
  <line class="msg" x1="360" y1="228" x2="605" y2="228"/>
  <circle class="numc" cx="360" cy="228" r="9"/><text class="num" x="360" y="232" text-anchor="middle">4</text>
  <text class="step" x="482" y="220" text-anchor="middle">Netlogon — validate response</text>

  <!-- 5: verdict -->
  <line class="msg" x1="605" y1="272" x2="360" y2="272"/>
  <circle class="numc" cx="605" cy="272" r="9"/><text class="num" x="605" y="276" text-anchor="middle">5</text>
  <text class="step" x="482" y="264" text-anchor="middle">pass / fail</text>

  <!-- 6: access -->
  <line class="msg" x1="360" y1="316" x2="115" y2="316"/>
  <circle class="numc" cx="360" cy="316" r="9"/><text class="num" x="360" y="320" text-anchor="middle">6</text>
  <text class="step" x="237" y="308" text-anchor="middle">access granted</text>

  <text class="step" x="360" y="350" text-anchor="middle" fill="#6F8085">The password never crosses the wire. The NT hash never leaves the client.</text>
  <text class="step" x="360" y="368" text-anchor="middle" fill="#6F8085">That is the whole design — and the whole problem.</text>
</svg>
