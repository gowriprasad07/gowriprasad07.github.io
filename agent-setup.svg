<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agent and server setup: multiple endpoint agents talking to a central management server, each storing keys locally" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .h    { font: 600 12px "IBM Plex Sans", sans-serif; fill: #EDF3F3; }
    .lbl  { font: 500 11px "IBM Plex Sans", sans-serif; fill: #DDE6E7; }
    .mono { font: 400 10px "IBM Plex Mono", monospace; fill: #A6B5B8; }
    .note { font: 400 9px "IBM Plex Mono", monospace; fill: #6F8085; }
    .box  { fill: #101A1E; stroke: #1D2E34; }
    .srv  { fill: #162328; stroke: #2F8F8A; }
    .vault{ fill: #0A1013; stroke: #8A5A16; }
    .link { stroke: #53D6CE; stroke-width: 1.5; }
    .tls  { font: 500 9px "IBM Plex Mono", monospace; fill: #53D6CE; }
  </style>

  <!-- central server -->
  <rect class="srv" x="270" y="24" width="160" height="70" rx="3"/>
  <text class="h" x="350" y="50" text-anchor="middle">Management Server</text>
  <text class="mono" x="350" y="68" text-anchor="middle">issues tokens / keys</text>
  <text class="mono" x="350" y="82" text-anchor="middle">verifies each agent</text>

  <!-- three agents -->
  <g>
    <rect class="box" x="40"  y="230" width="170" height="120" rx="3"/>
    <text class="h" x="125" y="254" text-anchor="middle">Endpoint Agent</text>
    <text class="note" x="125" y="272" text-anchor="middle">runs on a user's machine</text>
    <rect class="vault" x="60" y="286" width="130" height="48" rx="3"/>
    <text class="lbl" x="125" y="305" text-anchor="middle">local key store</text>
    <text class="note" x="125" y="322" text-anchor="middle">token · db · registry</text>
  </g>
  <g>
    <rect class="box" x="265" y="230" width="170" height="120" rx="3"/>
    <text class="h" x="350" y="254" text-anchor="middle">Endpoint Agent</text>
    <text class="note" x="350" y="272" text-anchor="middle">runs on a user's machine</text>
    <rect class="vault" x="285" y="286" width="130" height="48" rx="3"/>
    <text class="lbl" x="350" y="305" text-anchor="middle">local key store</text>
    <text class="note" x="350" y="322" text-anchor="middle">token · db · registry</text>
  </g>
  <g>
    <rect class="box" x="490" y="230" width="170" height="120" rx="3"/>
    <text class="h" x="575" y="254" text-anchor="middle">Endpoint Agent</text>
    <text class="note" x="575" y="272" text-anchor="middle">runs on a user's machine</text>
    <rect class="vault" x="510" y="286" width="130" height="48" rx="3"/>
    <text class="lbl" x="575" y="305" text-anchor="middle">local key store</text>
    <text class="note" x="575" y="322" text-anchor="middle">token · db · registry</text>
  </g>

  <!-- links -->
  <line class="link" x1="300" y1="94" x2="140" y2="230"/>
  <line class="link" x1="350" y1="94" x2="350" y2="230"/>
  <line class="link" x1="400" y1="94" x2="560" y2="230"/>

  <text class="tls" x="192" y="150" text-anchor="middle">HTTPS + mTLS</text>
  <text class="tls" x="368" y="150" text-anchor="middle">HTTPS + mTLS</text>
  <text class="tls" x="512" y="150" text-anchor="middle">HTTPS + mTLS</text>

  <text class="note" x="350" y="372" text-anchor="middle" fill="#6F8085">Every line and every local key store is attack surface. The orange boxes are where most of my findings lived.</text>
</svg>
