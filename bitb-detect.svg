<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How the extension detects a BitB window: it checks for an iframe inside the popup and whether its frameBorder is removed" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .h    { font: 600 13px "IBM Plex Sans", sans-serif; fill: #EDF3F3; }
    .mono { font: 400 11px "IBM Plex Mono", monospace; fill: #A6B5B8; }
    .note { font: 400 10px "IBM Plex Mono", monospace; fill: #6F8085; }
    .ok   { font: 500 12px "IBM Plex Sans", sans-serif; fill: #53D6CE; }
    .bad  { font: 500 12px "IBM Plex Sans", sans-serif; fill: #C86A62; }
    .box  { fill: #101A1E; stroke: #1D2E34; }
    .step { fill: #162328; stroke: #2F8F8A; }
  </style>

  <text class="h" x="30" y="30">The extension asks two questions</text>

  <!-- step 1 -->
  <rect class="step" x="30" y="55" width="300" height="90" rx="3"/>
  <text class="mono" x="46" y="80" fill="#53D6CE">1</text>
  <text class="h" x="66" y="80" style="font-size:12px">Is there an iframe inside the SSO window?</text>
  <text class="note" x="46" y="104">A real popup is a browser window.</text>
  <text class="note" x="46" y="120">A fake one is an &lt;iframe&gt; drawn in the page.</text>
  <text class="note" x="46" y="136">No iframe → not BitB. Iframe found → check step 2.</text>

  <!-- step 2 -->
  <rect class="step" x="370" y="55" width="300" height="90" rx="3"/>
  <text class="mono" x="386" y="80" fill="#53D6CE">2</text>
  <text class="h" x="406" y="80" style="font-size:12px">Is frameBorder removed (null / 0)?</text>
  <text class="note" x="386" y="104">Attackers strip the border so the</text>
  <text class="note" x="386" y="120">iframe blends in as a clean window.</text>
  <text class="note" x="386" y="136">Border gone → the tell-tale sign.</text>

  <!-- verdict -->
  <rect class="box" x="30" y="175" width="310" height="70" rx="3" stroke="#33604E"/>
  <text class="ok" x="185" y="205" text-anchor="middle">Only one check true</text>
  <text class="note" x="185" y="226" text-anchor="middle" fill="#6F8085">not flagged</text>

  <rect class="box" x="370" y="175" width="300" height="70" rx="3" stroke="#8E2B24"/>
  <text class="bad" x="520" y="205" text-anchor="middle">Both checks true</text>
  <text class="note" x="520" y="226" text-anchor="middle" fill="#C86A62">vulnerable to BitB</text>

  <text class="note" x="350" y="280" text-anchor="middle" fill="#6F8085">Both must be true to flag it. In testing this hit 100% across 15 SSO sites plus a planted BitB page.</text>
</svg>
